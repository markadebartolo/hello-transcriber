name: macOS build and regression checks
on:
  pull_request:
  push:
    branches: [main, feature/hello-release]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: hello-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Show toolchain
        run: xcodebuild -version
      - name: Test and compile both architectures without app launch
        run: bash hello/scripts/check.sh
      # CI deliberately uploads no unsigned application or distribution artifact.
